<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Stream API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e2e8f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 600px;
    width: 100%;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 2.5rem;
    background: #111118;
  }
  h1 { font-size: 1.4rem; color: #818cf8; margin-bottom: 0.5rem; }
  p  { color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.6; }
  .endpoint {
    background: #0d0d14;
    border: 1px solid #1e1e2e;
    border-radius: 6px;
    padding: 1rem 1.2rem;
    color: #38bdf8;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  label { display: block; color: #94a3b8; font-size: 0.78rem; margin-bottom: 0.3rem; }
  input {
    width: 100%;
    background: #0d0d14;
    border: 1px solid #2a2a3a;
    border-radius: 5px;
    color: #e2e8f0;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.6rem 0.9rem;
    margin-bottom: 0.8rem;
    outline: none;
  }
  input:focus { border-color: #818cf8; }
  button {
    background: #818cf8;
    color: #0a0a0f;
    border: none;
    border-radius: 5px;
    padding: 0.6rem 1.4rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #a5b4fc; }
</style>
</head>
<body>
<div class="card">
  <h1>🎬 Movie Stream API</h1>
  <p>Returns direct MP4 stream URLs for any movie using its TMDB ID.</p>
  <label>Endpoint</label>
  <div class="endpoint">/movie/[tmdb_id]</div>
  <label>Try it — enter a TMDB ID</label>
  <input id="tid" type="text" placeholder="e.g. 218  (The Terminator)" value="218">
  <button onclick="go()">Fetch Streams →</button>
</div>
<script>
function go() {
  const id = document.getElementById("tid").value.trim();
  if (id) location.href = "/movie/" + id;
}
document.getElementById("tid").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
</script>
</body>
</html>
